<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "{{ site.social.name }}",
    "url": "{{ site.url }}/",
    "image": "{{ site.seo.image | absolute_url }}",
    "telephone": "+17076600414",
    "email": "{{ site.email }}",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Vacaville",
      "addressRegion": "CA",
      "addressCountry": "US"
    },
    "areaServed": [
      "Vacaville", "Solano County", "Napa", "Sacramento Valley", "San Francisco Bay Area"
    ],
    "sameAs": [
      {% for link in site.social.links %}"{{ link }}"{% unless forloop.last %},{% endunless %}{% endfor %}
    ]
  }
</script>

{% if page.layout == 'package' %}
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": {{ page.title | jsonify }},
      "image": {{ page.image | absolute_url | jsonify }},
      "description": {{ page.description | strip_html | strip_newlines | jsonify }},
      "offers": {
        "@type": "Offer",
        "url": {{ page.url | absolute_url | jsonify }},
        "priceCurrency": "USD",
        "price": {{ page.price | jsonify }}
      }
    }
  </script>
{% endif %}

{% if page.url == '/about/faqs/' %}
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {% for faq in site.faqs %}
        {
          "@type": "Question",
          "name": {{ faq.question | jsonify }},
          "acceptedAnswer": {
            "@type": "Answer",
            "text": {{ faq.answer | jsonify }}
          }
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    }
  </script>
{% endif %}
