# Site Settings
title: VANS PRO AUDIO
description: Professional audio and lighting equipment rentals in Vacaville, serving the Bay Area, Napa, and the Sacramento Valley in Northern California.
url: "https://www.vansproaudio.com"
baseurl: ""
author: "Edwin Vans"
email: "bookings@vansproaudio.com"
lang: "en"
timezone: "America/Los_Angeles"
branding: "VANS PRO AUDIO"

year: 2026
company: "VANS PRO AUDIO"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate-v2

seo:
  title: "VANS PRO AUDIO"
  description: "Professional audio and lighting equipment rentals in Vacaville, serving the Bay Area, Napa, and the Sacramento Valley in Northern California."
  url: "https://www.vansproaudio.com"
  image: "/assets/images/home.jpg"

# After verifying in Google Search Console / Bing Webmaster Tools, uncomment and
# paste your codes here — jekyll-seo-tag will render the verification meta tags.
# webmaster_verifications:
#   google: "your-google-verification-code"
#   bing: "your-bing-verification-code"

social:
  name: "VANS PRO AUDIO"
  links:
    - "https://www.youtube.com/@VProAudioRentals"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - maintenance.md
  - node_modules
  - package.json
  - package-lock.json
  - vendor

collections:
  pages:
    output: true
  faqs:
    output: false
  packages:
    output: true

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      image: "/assets/images/home.jpg"
      author: "Edwin Vans"
      seo:
        type: WebPage
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      seo:
        type: BlogPosting

# Setup guides pagination
pagination:
  enabled: true
  collection: posts
  category: setup-guides
  per_page: 6
  permalink: /support/setup-guides/page/:num/
