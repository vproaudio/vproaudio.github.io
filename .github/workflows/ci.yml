name: CI

on:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build site
        run: JEKYLL_ENV=production npm run build

      - name: Run HTMLProofer
        run: JEKYLL_ENV=production bundle exec htmlproofer ./_site --disable-external --enforce-https
