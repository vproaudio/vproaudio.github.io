name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  # Finish an active production release; newer PR checks can replace older ones.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JEKYLL_ENV: production

jobs:
  quality:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run Jekyll doctor
        run: npm run doctor

      - name: Build site
        run: npm run build

      - name: Run HTMLProofer
        run: npm run proof

      - name: Verify build artifact
        run: test -f _site/index.html

  deploy:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site version
        id: version
        run: |
          NEXT_VERSION="$(npm run version:bump --silent)"
          TAG="v${NEXT_VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Retry a failed deployment using the same validated release commit.
          # Never reuse a version tag belonging to different source changes.
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            if [ "$(git rev-parse "$TAG^1")" != "$GITHUB_SHA" ] ||
               ! git diff --quiet "$TAG" -- .; then
              echo "::error::Tag $TAG already belongs to different changes."
              exit 1
            fi
            git restore package.json package-lock.json _data/site_version.yml
            git checkout --detach "$TAG"
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Jekyll doctor
        run: npm run doctor

      - name: Build site
        run: npm run build

      - name: Run HTMLProofer
        run: npm run proof

      - name: Verify build artifact
        run: test -f _site/index.html

      - name: Commit and tag validated version
        if: steps.version.outputs.existing != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json _data/site_version.yml
          git commit -m "Bump site version to ${RELEASE_TAG} [skip ci]"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          # Publish both refs together. Fail without overwriting newer main commits.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"

      - name: Verify release is still current
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main has advanced; let its newer workflow deploy instead."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "$RELEASE_TAG" --generate-notes
          fi
