# Individual rental catalog. Access in Jekyll as site.data.rental_items.
# Prices are intentionally unset: replace rental_price: null with a number (e.g. 25).
# USD per day follows the site's existing pricing convention; adjust if needed.
# null means not priced, never free. rental_unit describes the quoted unit.
# IDs preserve the supplied image stems; slugs are stable URL-safe identifiers.
# Manufacturer specifications describe the model, not guaranteed rental accessories.
# rental_notes are customer-facing setup notes; model_note is an internal review note.
# Sources reviewed 2026-10-15. See README.md for editing and Liquid examples.

